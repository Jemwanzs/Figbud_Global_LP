name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: Websites (lint, types, unit, build, e2e)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Shipped (production) dependencies only; dev tooling is tracked by Dependabot.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # Built against the e2e mock API so prerendered pages carry registry data
      # (statuses, published logos), as production builds do against the real API.
      - run: node scripts/build-with-mock-api.mjs
      - run: npx playwright install --with-deps chromium firefox webkit
        working-directory: apps/figbud-web
      - run: npm run test:e2e
      - name: ZiraHR website e2e
        run: npm run test:e2e -w zirahr-web
      - name: Product-site renderer e2e
        run: npm run test:e2e -w sites-web

  lighthouse:
    name: Lighthouse (production build, mobile)
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Audited as production: indexable, so SEO is scored as it will ship.
      - run: npm run build
        env:
          NEXT_PUBLIC_ALLOW_INDEXING: "true"
          NEXT_PUBLIC_SITE_URL: http://localhost:3300
      - run: npx -y @lhci/cli@0.15.x autorun
        working-directory: apps/figbud-web
      # Median scores per page as run annotations, readable on the run page.
      - name: Summarise scores
        if: always()
        run: node scripts/lighthouse-summary.mjs apps/figbud-web/.lighthouseci

  api:
    name: API (fmt, clippy, tests with PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: figbud
          POSTGRES_PASSWORD: figbud_ci
          POSTGRES_DB: figbud_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U figbud -d figbud_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://figbud:figbud_ci@localhost:5432/figbud_test
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      # webauthn-rs links OpenSSL; installed explicitly so runner image changes cannot break it.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libssl-dev pkg-config
      # Pinned to the version in services/api/Dockerfile and infra/rust-dev, so new
      # Clippy lints arrive with a deliberate upgrade, not on a random push.
      - uses: dtolnay/rust-toolchain@1.99
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/api
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit
