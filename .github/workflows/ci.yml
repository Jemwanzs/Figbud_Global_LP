name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: Website (lint, types, unit, build, e2e)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Shipped (production) dependencies only; dev tooling is tracked by Dependabot.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium firefox webkit
        working-directory: apps/figbud-web
      - run: npm run test:e2e

  lighthouse:
    name: Lighthouse (production build, mobile)
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Audited as production: indexable, so SEO is scored as it will ship.
      - run: npm run build
        env:
          NEXT_PUBLIC_ALLOW_INDEXING: "true"
          NEXT_PUBLIC_SITE_URL: http://localhost:3300
      - run: npx -y @lhci/cli@0.15.x autorun
        working-directory: apps/figbud-web
      # Median scores per page as run annotations, readable on the run page.
      - name: Summarise scores
        if: always()
        working-directory: apps/figbud-web
        run: |
          node -e '
            const runs = require("./.lighthouseci/manifest.json").filter((r) => r.isRepresentativeRun);
            for (const r of runs) {
              const s = Object.entries(r.summary).map(([k, v]) => `${k} ${Math.round(v * 100)}`).join(" · ");
              console.log(`::notice title=Lighthouse ${new URL(r.url).pathname}::${s}`);
            }'

  api:
    name: API (fmt, clippy, tests with PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: figbud
          POSTGRES_PASSWORD: figbud_ci
          POSTGRES_DB: figbud_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U figbud -d figbud_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://figbud:figbud_ci@localhost:5432/figbud_test
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/api
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit
