# Weekly dependency updates, grouped so routine bumps arrive as a few PRs.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      next-react:
        patterns: ["next", "eslint-config-next", "react", "react-dom", "@types/react*"]
      tooling:
        dependency-type: development
      runtime:
        dependency-type: production

  - package-ecosystem: cargo
    directory: /services/api
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      rust:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }

  - package-ecosystem: docker
    directories: [/services/api, /apps/figbud-web]
    schedule: { interval: monthly }
    ignore:
      # Stay on the Node.js LTS line pinned in .nvmrc; majors are a deliberate upgrade.
      - dependency-name: node
        update-types: [version-update:semver-major]
