# Railway service definition for the FigBud API (not yet provisioned).
# Set the service root directory to `services/api` in Railway.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
watchPatterns = ["/services/api/**"]

[deploy]
healthcheckPath = "/health/ready"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
