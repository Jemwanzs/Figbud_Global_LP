# Reference only: Railway no longer applies railway.toml (see docs/DEPLOYMENT.md).
# These settings are configured on the figbud-api service (root `services/api`).
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
watchPatterns = ["/services/api/**"]

[deploy]
healthcheckPath = "/health/ready"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
