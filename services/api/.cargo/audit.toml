# cargo audit exceptions. Each one says why it can't affect the API, and CI
# checks that reason still holds (.github/workflows/ci.yml, "Excepted crates
# stay out of the build").
[advisories]
ignore = [
  # libsqlite3-sys 0.37.0 (SQLite CVE-2026-119375; fixed in 0.39.0). Listed in
  # Cargo.lock only as an optional dependency of sqlx's SQLite driver, which
  # isn't enabled (the API uses PostgreSQL), so it is never compiled or linked.
  # Remove once sqlx releases a version that allows 0.39 (11 Nov 2026: 0.9.0 is
  # the latest).
  "RUSTSEC-2026-0459",
]
