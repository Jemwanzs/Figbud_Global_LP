[package]
name = "figbud-api"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "FigBud Global website API: enquiries, lead capture and transactional email"
publish = false

[dependencies]
axum = { version = "0.8.9", features = ["macros"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
tower = { version = "0.5", features = ["limit", "timeout"] }
tower-http = { version = "0.7", features = ["cors", "trace", "compression-gzip", "compression-br", "limit", "request-id", "set-header", "timeout", "util"] }
sqlx = { version = "0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls", "migrate", "macros", "uuid", "chrono", "json", "rust_decimal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
thiserror = "2"
sha2 = "0.11"
hex = "0.4"
rand = "0.9"
dotenvy = "0.15"
async-trait = "0.1"
pulldown-cmark = { version = "0.13.5", default-features = false, features = ["html"] }
webauthn-rs = { version = "0.5.4", features = ["danger-allow-state-serialisation"] }
url = "2"
# International phone validation and E.164 formatting (libphonenumber metadata).
phonenumber = "0.3"
# Exact decimal arithmetic for pricing and quotations (never floating point).
rust_decimal = { version = "1", features = ["serde-str", "macros"] }
image = { version = "0.25.10", default-features = false, features = ["png", "webp", "jpeg"] }
resvg = { version = "0.48.1", default-features = false }
usvg = { version = "0.48.1", default-features = false, features = ["writer"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
webauthn-authenticator-rs = { version = "0.5", features = ["softpasskey"] }

# Image decoding and resizing are slow unoptimised; optimise those crates in
# dev and test builds too (uploads would otherwise hit the request timeout).
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.zune-jpeg]
opt-level = 3
[profile.dev.package.image-webp]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
