# Railway service definition for the FigBud Global website (not yet provisioned).
# Keep the service root at the repository root so shared packages are in the build context.
[build]
builder = "DOCKERFILE"
dockerfilePath = "apps/figbud-web/Dockerfile"
watchPatterns = ["/apps/figbud-web/**", "/packages/**", "/package.json", "/package-lock.json"]

[deploy]
healthcheckPath = "/en"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
