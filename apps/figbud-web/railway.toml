# Reference only: Railway no longer applies railway.toml (see docs/DEPLOYMENT.md).
# The live figbud-web service builds with Railpack from the repository root.
[build]
builder = "DOCKERFILE"
dockerfilePath = "apps/figbud-web/Dockerfile"
watchPatterns = ["/apps/figbud-web/**", "/packages/**", "/package.json", "/package-lock.json"]

[deploy]
healthcheckPath = "/en"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
